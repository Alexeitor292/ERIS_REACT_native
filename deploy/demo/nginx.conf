# Static simulation only. No upstreams, API proxy, credentials, or record storage.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log off;
  add_header X-Content-Type-Options nosniff always;
  # Public map tiles require website identification; cross-origin requests send only the origin.
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Cache-Control "no-store" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.arcgis.com https://*.arcgisonline.com https://*.esri.com https://*.openstreetmap.org; font-src 'self' data:; connect-src 'self' blob: https://*.arcgis.com https://*.arcgisonline.com https://*.esri.com https://*.openstreetmap.org; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
  location ^~ /api { return 404; }
  location ^~ /auth { return 404; }
  location = /healthz { return 200 "ok\n"; }
  location /assets/ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
