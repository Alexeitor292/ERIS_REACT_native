name: Patch Project Required Test Fixtures

on:
  push:
    branches:
      - feature/project-domain-foundation

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/project-domain-foundation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply guarded DB fixture updates
        run: python scripts/patch_project_required_test_fixtures.py

      - name: Validate patched tests
        run: |
          set -Eeuo pipefail
          python -m compileall -q backend/tests
          git diff --check

      - name: Commit test fixture updates
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/tests/test_assessment_flow.py \
            backend/tests/test_db_smoke.py \
            backend/tests/test_elevation_profile.py \
            backend/tests/test_offline_scene.py \
            backend/tests/test_offline_scene_generation.py \
            backend/tests/test_road_inventory.py \
            backend/tests/test_terrain_grid.py \
            backend/tests/test_workflow_tree.py
          test -n "$(git diff --cached --name-only)"
          git commit -m "test(projects): establish Project ownership in legacy lifecycle fixtures"
          git push origin HEAD:feature/project-domain-foundation
