name: Temporary legacy assign Project guard patch

on:
  push:
    branches:
      - fix/mobile-road-package-and-project-gate

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-road-package-and-project-gate
          fetch-depth: 0
      - name: Apply exact guarded edit
        run: python3 scripts/_patch_legacy_assign_project_guard.py
      - name: Syntax check
        run: python3 -m py_compile backend/app/routes/incidents.py
      - name: Commit patch
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/routes/incidents.py
          git commit -m 'fix(api): return controlled Project gate on legacy assignment'
          git push origin HEAD:fix/mobile-road-package-and-project-gate
