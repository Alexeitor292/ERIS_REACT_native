name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python compile check
        run: |
          python -m py_compile app/main.py
          python -m py_compile app/migrations_check.py
          python -m py_compile app/routes/incidents.py
          python -m py_compile migrations/env.py
          python -m py_compile migrations/versions/0001_baseline.py

      - name: Alembic script check
        run: |
          alembic history
          alembic heads

      - name: Run smoke tests
        env:
          DB_PASS: ci_placeholder
          JWT_SECRET: ci_placeholder_secret
        run: python -m pytest tests/ -m "not db" -v --tb=short

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc -p tsconfig.json --noEmit

      - name: Build
        run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc -p tsconfig.json --noEmit

  backend-db:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: rootpassword
          MARIADB_DATABASE: eris
          MARIADB_USER: eris_user
          MARIADB_PASSWORD: CHANGE_ME_APP_DB_PASSWORD
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: eris
      DB_USER: eris_user
      DB_PASS: CHANGE_ME_APP_DB_PASSWORD
      JWT_SECRET: ci_placeholder_secret
      ENV: dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialize schema and seed data
        run: |
          mysql -h 127.0.0.1 -u root -prootpassword < ../database/init/010_schema.sql
          mysql -h 127.0.0.1 -u root -prootpassword < ../database/init/020_seed.sql

      - name: Stamp Alembic baseline
        run: |
          alembic stamp 0001_baseline
          alembic current

      - name: Run DB integration tests
        run: python -m pytest tests/ -m db -v --tb=short

  docker-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: docker compose --env-file docker/.env.example -f docker/docker-compose.yml config
