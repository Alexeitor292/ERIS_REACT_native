name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python compile check
        run: |
          python -m py_compile app/main.py
          python -m py_compile app/migrations_check.py
          python -m py_compile app/routes/incidents.py
          python -m py_compile migrations/env.py
          python -m py_compile migrations/versions/0001_baseline.py

      - name: Alembic script check
        run: |
          alembic history
          alembic heads

      - name: Run smoke tests
        env:
          DB_PASS: ci_placeholder
          JWT_SECRET: ci_placeholder_secret
        run: python -m pytest tests/ -v --tb=short

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc -p tsconfig.json --noEmit

      - name: Build
        run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc -p tsconfig.json --noEmit

  docker-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: docker compose --env-file docker/.env.example -f docker/docker-compose.yml config
