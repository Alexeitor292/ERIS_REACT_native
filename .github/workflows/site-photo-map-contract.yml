name: Site Photo Map Contract

# This workflow is a required status check. Required checks must run for every
# PR/push; path-filtering the workflow leaves unrelated PRs permanently stuck in
# an "Expected" state with no check run to satisfy the repository rule.
on:
  pull_request:
  push:

jobs:
  contract:
    name: Native camera telemetry contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Site Photo Map source contract
        run: node scripts/check-site-photo-map-contract.mjs
      - name: TypeScript check
        run: npx tsc -p tsconfig.json --noEmit
