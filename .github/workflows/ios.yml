name: iOS

# The native Swift ERIS iOS app (ios/). ERISKit's tests run on Linux (cheap);
# only when they pass do the macOS jobs build every app configuration with
# Xcode. The committed project must match ios/project.yml, so the Caltrans Mac
# needs only Xcode to open it. CI never writes source back to the repository.
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml", "web/src/memoIos/**", "web/src/features/submissions/memo*",
            "web/src/index.css", "web/scripts/build-memo-ios.mjs", "web/package-lock.json"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml", "web/src/memoIos/**", "web/src/features/submissions/memo*",
            "web/src/index.css", "web/scripts/build-memo-ios.mjs", "web/package-lock.json"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eriskit:
    name: ERISKit tests (Linux)
    runs-on: ubuntu-latest
    # Pinned: GitHub's Ubuntu images do not all come with Swift.
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test
        working-directory: ios/ERISKit
        run: swift test

  # The memo editor in the app is the web form's own editor, built into one
  # page (web/scripts/build-memo-ios.mjs). The committed page must be what its
  # sources build, so a change to the web memo editor reaches the app.
  memo-editor:
    name: Memo editor page is up to date
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build:memo-ios
      - name: Compare with the committed page
        run: git diff --exit-code -- ../ios/ERIS/Resources/MemoEditor.html || (echo "Run 'npm run build:memo-ios' in web/ and commit ios/ERIS/Resources/MemoEditor.html." && exit 1)

  app:
    name: App build (Xcode, ${{ matrix.configuration }})
    needs: eriskit
    runs-on: macos-26
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Staging, Release]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify distribution-supported Xcode and SDK
        run: |
          xcodebuild -version
          xcode_version=$(xcodebuild -version | awk '/^Xcode / {print $2}')
          ios_sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          python3 -c 'import sys; assert int(sys.argv[1].split(".")[0]) >= 26; assert int(sys.argv[2].split(".")[0]) >= 26' "$xcode_version" "$ios_sdk"
      - name: ERISKit tests (macOS)
        working-directory: ios/ERISKit
        run: swift test
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Check the committed project is current
        run: >-
          git diff --exit-code -- ios/ERIS.xcodeproj ||
          (echo 'Regenerate with xcodegen generate --spec ios/project.yml and commit ios/ERIS.xcodeproj.' && exit 1)
      - name: Build ${{ matrix.configuration }} for the iOS simulator
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          set -o pipefail
          set +e
          xcodebuild -project ios/ERIS.xcodeproj -scheme ERIS -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ERIS-derived-data" \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee "build-$CONFIGURATION.log" \
            | grep -E "error:|warning: .*ERIS|BUILD (SUCCEEDED|FAILED)"
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -ne 0 ]; then exit "$build_status"; fi
          grep -q "BUILD SUCCEEDED" "build-$CONFIGURATION.log"
          plutil -lint "$RUNNER_TEMP/ERIS-derived-data/Build/Products/$CONFIGURATION-iphonesimulator/ERIS.app/PrivacyInfo.xcprivacy"
      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ matrix.configuration }}
          path: build-*.log
          if-no-files-found: ignore
      - name: Upload the generated project for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-xcode-project-${{ matrix.configuration }}
          path: ios/ERIS.xcodeproj
