name: Temporary mobile Project gate patch

on:
  push:
    branches:
      - fix/mobile-road-package-and-project-gate

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-road-package-and-project-gate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact guarded edit
        run: python3 scripts/_patch_mobile_project_gate.py
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Mobile TypeScript check
        working-directory: mobile
        run: npx tsc --noEmit
      - name: Validate patch and commit
        run: |
          set -euo pipefail
          git diff --check
          git diff -- mobile/app/'(tabs)'/incidents/index.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/app/'(tabs)'/incidents/index.tsx
          git commit -m 'fix(mobile): require Project review before workflow advancement'
          git push origin HEAD:fix/mobile-road-package-and-project-gate
