name: Deployment images
on:
  pull_request:
    paths: ["backend/**", "web/**", "deploy/**", ".github/workflows/deployment-images.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "web/**", "deploy/**", ".github/workflows/deployment-images.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deployment-images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  images:
    name: Image ${{ matrix.name }} (build, SBOM, all-severity scan)
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: api, dockerfile: backend/Dockerfile, context: backend}
          - {name: worker, dockerfile: backend/Dockerfile.worker, context: backend}
          - {name: web, dockerfile: web/Dockerfile, context: web}
          - {name: mariadb, dockerfile: deploy/images/Dockerfile.mariadb, context: .}
          - {name: seaweedfs, dockerfile: deploy/images/Dockerfile.seaweedfs, context: .}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build candidate from this exact source, refreshing OS packages
        run: |
          args=()
          if [ '${{ matrix.name }}' = web ]; then args+=(--build-arg ERIS_API_UPSTREAM=127.0.0.1:8000); fi
          docker build --pull --no-cache --label org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }} \
            "${args[@]}" -f ${{ matrix.dockerfile }} -t localhost/eris/${{ matrix.name }}:candidate ${{ matrix.context }}
      - name: Exact API runtime imports and installer removal
        if: matrix.name == 'api'
        run: >-
          docker run --rm --network none -e DB_PASS=ci_placeholder -e JWT_SECRET=ci_placeholder
          localhost/eris/api:candidate python -c "import pytest; import app.asgi; import importlib.util; assert importlib.util.find_spec('pip') is None"
      - name: Exact worker GeoTIFF and GDAL/PROJ projection
        if: matrix.name == 'worker'
        run: |
          docker run --rm -i --network none -e DB_PASS=ci_placeholder -e JWT_SECRET=ci_placeholder localhost/eris/worker:candidate python - <<'PY'
          import importlib.util
          import numpy as np
          import rasterio
          from rasterio.io import MemoryFile
          from rasterio.transform import from_origin
          from rasterio.warp import calculate_default_transform, reproject, Resampling
          from app.worker.offline_scene_worker import run_worker
          from app.services.offline_scene_builder import HillshadeReliefBuilder
          assert importlib.util.find_spec('pip') is None
          source = np.array([[10, 20], [30, 40]], dtype='float32')
          transform = from_origin(-121, 38, 0.01, 0.01)
          with MemoryFile() as mem:
              with mem.open(driver='GTiff', height=2, width=2, count=1, dtype='float32', crs='EPSG:4326', transform=transform) as dst:
                  dst.write(source, 1)
              with mem.open() as src:
                  np.testing.assert_array_equal(src.read(1), source)
                  dst_transform, width, height = calculate_default_transform(src.crs, 'EPSG:3857', src.width, src.height, *src.bounds)
                  target = np.zeros((height, width), dtype='float32')
                  reproject(rasterio.band(src, 1), target, src_transform=src.transform, src_crs=src.crs, dst_transform=dst_transform, dst_crs='EPSG:3857', resampling=Resampling.nearest)
                  assert np.isfinite(target).all() and target.min() >= source.min() and target.max() <= source.max()
          print('GeoTIFF decode and GDAL/PROJ reproject OK:', rasterio.__gdal_version__)
          PY
      - name: Record exact identity and export test candidate
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/source-commit.txt"
          docker image inspect --format '{{.Id}}' localhost/eris/${{ matrix.name }}:candidate > "$RUNNER_TEMP/evidence/image-id.txt"
          docker save localhost/eris/${{ matrix.name }}:candidate | gzip -1 > "$RUNNER_TEMP/evidence/${{ matrix.name }}.tar.gz"
      - name: Generate SBOM and fail on any known vulnerability or embedded secret
        env:
          TRIVY: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/evidence:/evidence" -v "$RUNNER_TEMP/trivy:/cache" "$TRIVY" --cache-dir /cache image --format cyclonedx --output /evidence/sbom.cdx.json localhost/eris/${{ matrix.name }}:candidate
          gate=0
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/evidence:/evidence" -v "$RUNNER_TEMP/trivy:/cache" "$TRIVY" --cache-dir /cache image --scanners vuln,secret --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --exit-code 1 --format json --output /evidence/scan.json localhost/eris/${{ matrix.name }}:candidate || gate=$?
          python3 - "$RUNNER_TEMP/evidence/scan.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          for result in report.get("Results", []):
              for finding in result.get("Vulnerabilities", []):
                  print(result["Target"], finding["VulnerabilityID"], finding["PkgName"], finding["InstalledVersion"], "fixed=" + finding.get("FixedVersion", "none"), finding["Severity"])
              for finding in result.get("Secrets", []):
                  print("Embedded secret:", result["Target"], finding.get("RuleID"), finding.get("Severity"))
          PY
          exit "$gate"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/evidence/*.json
            ${{ runner.temp }}/evidence/*.txt
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-${{ matrix.name }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
  podman:
    name: Release regressions and real rootless secrets
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify supported Podman and rootless mapping
        run: |
          podman --version
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
      - name: Deployment and publication regression tests
        run: |
          bash deploy/podman/tests/test-eris-pod.sh
          bash deploy/podman/tests/test-verify-rehearsal.sh
          bash deploy/ci/tests/test-release-gate.sh
          bash deploy/ci/tests/test-publish-release.sh
      - name: Real rootless private secret permissions and rotation
        run: bash deploy/podman/tests/test-native-secrets.sh
  rehearsal:
    name: Five-image rootless installation and recovery
    needs: [images, podman]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: ${{ runner.temp }}/candidates
      - name: Load the exact candidates built and scanned above
        run: |
          for name in api worker web mariadb seaweedfs; do
            test "$(cat "$RUNNER_TEMP/candidates/candidate-$name/source-commit.txt")" = "$(git rev-parse HEAD)"
            gzip -dc "$RUNNER_TEMP/candidates/candidate-$name/$name.tar.gz" | podman load
          done
      - name: Fresh installation, native secret, signed files and matched restore
        env:
          ERIS_TEST_API_IMAGE: localhost/eris/api:candidate
          ERIS_TEST_WORKER_IMAGE: localhost/eris/worker:candidate
          ERIS_TEST_WEB_IMAGE: localhost/eris/web:candidate
          ERIS_TEST_DB_IMAGE: localhost/eris/mariadb:candidate
          ERIS_TEST_STORAGE_IMAGE: localhost/eris/seaweedfs:candidate
        run: |
          set -o pipefail
          bash deploy/podman/tests/test-rootless-rehearsal.sh 2>&1 | tee "$RUNNER_TEMP/rehearsal.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rootless-rehearsal
          path: ${{ runner.temp }}/rehearsal.log
          if-no-files-found: ignore
          retention-days: 30
