name: Patch Project Domain Foundation

on:
  push:
    branches:
      - feature/project-domain-foundation

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/project-domain-foundation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply guarded Project-domain wiring
        run: python scripts/patch_project_domain_routes.py

      - name: Verify backend sources and non-DB tests
        working-directory: backend
        env:
          ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: eris
          DB_USER: eris_user
          DB_PASS: test-password
          JWT_SECRET: project-domain-ci-secret-project-domain-ci-secret
          MINIO_ENDPOINT: http://127.0.0.1:9800
          MINIO_ROOT_USER: test-minio
          MINIO_ROOT_PASSWORD: test-minio-password
        run: |
          set -Eeuo pipefail
          pip install -r requirements.txt
          python -m compileall -q app migrations
          pytest -m 'not db' -q

      - name: Commit guarded wiring
        run: |
          set -Eeuo pipefail
          git diff --check
          test -n "$(git status --porcelain -- backend/app/main.py backend/app/routes/incidents.py backend/app/routes/assessments.py backend/app/routes/projects.py)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/main.py backend/app/routes/incidents.py backend/app/routes/assessments.py backend/app/routes/projects.py
          git commit -m "feat(projects): wire Project authority into incident workflow"
          git push origin HEAD:feature/project-domain-foundation
