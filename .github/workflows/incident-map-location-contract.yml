name: Incident map location contract
on:
  pull_request:
    paths: ["ios/**", ".github/workflows/incident-map-location-contract.yml"]
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/incident-map-location-contract.yml"]
jobs:
  contract:
    name: Incident map location contract
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    defaults:
      run:
        working-directory: ios/ERISKit
    steps:
      - uses: actions/checkout@v7
      - name: Native Swift contract tests
        run: swift test --filter 'CaltransPostmileTests|SiteAreasTests'
