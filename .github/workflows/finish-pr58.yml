name: Finish PR58 merge readiness

on:
  push:
    branches:
      - fix/offline-dem-exact-extent
    paths:
      - .github/workflows/finish-pr58.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/offline-dem-exact-extent
          fetch-depth: 0

      - name: Merge current main and harden terrain identity
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

          python3 - <<'PY'
          from pathlib import Path

          worker_path = Path("backend/app/worker/offline_scene_worker.py")
          worker = worker_path.read_text()
          old_worker = '''def _terrain_content_identity() -> str:\n    """Exact DEM export/verification contract folded into package identity."""\n\n    from ..services import offline_scene_dem as dem\n\n    return dem.DEM_EXPORT_CONTRACT\n'''
          new_worker = '''def _terrain_content_identity() -> str:\n    """Terrain-generation contracts folded into package content identity.\n\n    Both the verified DEM georeferencing contract and the local hillshade\n    algorithm affect packaged bytes. Changing either must invalidate stale\n    packages already held by a device.\n    """\n\n    from ..services import offline_scene_dem as dem\n    from ..services import offline_scene_terrain as terrain\n\n    return f"{dem.DEM_EXPORT_CONTRACT}:{terrain.HILLSHADE_ALGORITHM}"\n'''
          assert worker.count(old_worker) == 1, "worker terrain identity anchor changed"
          worker_path.write_text(worker.replace(old_worker, new_worker, 1))

          test_path = Path("backend/tests/test_offline_scene_dem_package_contract.py")
          tests = test_path.read_text()
          old_test = '''def test_worker_uses_current_terrain_contract_identity():\n    assert (\n        worker._terrain_content_identity()\n        == dem.DEM_EXPORT_CONTRACT\n    )\n'''
          new_test = '''def test_worker_uses_current_terrain_contract_identity():\n    assert worker._terrain_content_identity() == (\n        f"{dem.DEM_EXPORT_CONTRACT}:{terrain.HILLSHADE_ALGORITHM}"\n    )\n\n\ndef test_worker_terrain_identity_changes_with_hillshade_algorithm(\n    monkeypatch,\n):\n    original = worker._terrain_content_identity()\n    monkeypatch.setattr(\n        terrain,\n        "HILLSHADE_ALGORITHM",\n        "local_verified_dem_gradient_v2",\n    )\n\n    changed = worker._terrain_content_identity()\n\n    assert changed != original\n    assert changed == (\n        f"{dem.DEM_EXPORT_CONTRACT}:local_verified_dem_gradient_v2"\n    )\n'''
          assert tests.count(old_test) == 1, "terrain identity test anchor changed"
          test_path.write_text(tests.replace(old_test, new_test, 1))
          PY

          python3 -m compileall -q backend/app backend/tests
          git diff --check

          rm .github/workflows/finish-pr58.yml
          git add -A
          git commit -m "fix(offline): bind hillshade algorithm to terrain package identity"
          git push origin HEAD:fix/offline-dem-exact-extent
