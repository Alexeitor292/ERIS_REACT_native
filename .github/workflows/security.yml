name: Security review

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets (redacted)
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP:/report"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --log-opts=--all --gitleaks-ignore-path /repo/.gitleaksignore --redact=100 --report-format json
          --report-path /report/gitleaks.json --no-banner
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: secret-scan
          path: ${{ runner.temp }}/gitleaks.json
          retention-days: 14

  python-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit==1.9.4
      - name: Preserve all static findings for review
        run: bandit -r backend/app -f json -o bandit.json --exit-zero
      - name: Refuse high-severity high-confidence findings
        run: bandit -r backend/app --severity-level high --confidence-level high
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-static-findings
          path: bandit.json
          retention-days: 14

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pip-audit==2.10.1
      - name: Audit API and worker resolved requirements
        run: pip-audit -r backend/requirements-worker.txt --progress-spinner off --format json --output python-audit.json
      - name: Audit locked web dependencies (all severities)
        if: always()
        working-directory: web
        run: npm audit --audit-level=low --json > ../npm-audit.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-audits
          path: |
            python-audit.json
            npm-audit.json
          retention-days: 14

  swift-dependencies:
    name: Native Swift dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan the current Swift lockfiles for known advisories
        run: >-
          docker run --rm -v "$PWD/ios:/source:ro" -v "$RUNNER_TEMP:/report"
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          fs --scanners vuln --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          --exit-code 1 --format json --output /report/swift-audit.json /source
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: swift-dependency-audit
          path: ${{ runner.temp }}/swift-audit.json
          retention-days: 30
