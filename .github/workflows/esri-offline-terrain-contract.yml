name: Esri offline terrain contract
on:
  pull_request:
    paths: ["ios/**", ".github/workflows/esri-offline-terrain-contract.yml"]
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/esri-offline-terrain-contract.yml"]
jobs:
  contract:
    name: Esri offline terrain contract
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    defaults:
      run:
        working-directory: ios/ERISKit
    steps:
      - uses: actions/checkout@v7
      - name: Native Swift contract tests
        run: swift test --filter 'OfflineSceneTests|TerrainBundleTests|TerrainSurfacePolicyTests'
