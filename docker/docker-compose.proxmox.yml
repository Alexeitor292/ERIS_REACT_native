services:
  adminer:
    profiles:
      - devtools

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: eris_backend
    restart: unless-stopped
    env_file:
      - .env.proxmox
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      ENV: ${ENV:-prod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: ${CORS_ORIGINS}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${MARIADB_DATABASE}
      DB_USER: ${MARIADB_USER}
      DB_PASS: ${MARIADB_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_BUCKET: ${MINIO_BUCKET:-eris-uploads}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_OFFLINE_SCENES_BUCKET: ${MINIO_OFFLINE_SCENES_BUCKET:-eris-offline-scenes}
      # Offline-scene policy — MUST match the worker so the API enforces the same
      # AOI/size limits at the generate + download endpoints.
      OFFLINE_SCENE_DEV_MODE: ${OFFLINE_SCENE_DEV_MODE:-false}
      OFFLINE_SCENE_MAX_RADIUS_M: ${OFFLINE_SCENE_MAX_RADIUS_M:-3000}
      OFFLINE_SCENE_MAX_PACKAGE_MB: ${OFFLINE_SCENE_MAX_PACKAGE_MB:-512}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALG: ${JWT_ALG:-HS256}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-120}
    ports:
      - "${API_BIND:-0.0.0.0}:8000:8000"
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_started
      # Block startup until the private offline-scenes bucket is provisioned +
      # posture-verified (fail-closed). Zero manual host-side steps.
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 10

  # One-shot bootstrap: create + verify the PRIVATE, versioned (object-lock)
  # offline-scenes bucket before backend/worker start. Fails closed (nonzero) if
  # the bucket cannot be made private + immutable, blocking the dependents. Does
  # not touch the uploads bucket.
  minio-init:
    image: minio/mc:latest
    container_name: eris_minio_init
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_OFFLINE_SCENES_BUCKET: ${MINIO_OFFLINE_SCENES_BUCKET:-eris-offline-scenes}
    entrypoint: ["/bin/sh", "/scripts/bootstrap-offline-scenes-bucket.sh"]
    volumes:
      - ./scripts:/scripts:ro

  # Automatic offline 3D scene-package generation worker. Separate process so
  # long USGS-3DEP terrain jobs never run in the API request path. Reuses the
  # backend image; claims QUEUED jobs from MariaDB and writes verified packages
  # to the private offline-scenes MinIO bucket.
  offline-scene-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.worker
    container_name: eris_offline_scene_worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker.offline_scene_worker"]
    env_file:
      - .env.proxmox
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      ENV: ${ENV:-prod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${MARIADB_DATABASE}
      DB_USER: ${MARIADB_USER}
      DB_PASS: ${MARIADB_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_BUCKET: ${MINIO_BUCKET:-eris-uploads}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_OFFLINE_SCENES_BUCKET: ${MINIO_OFFLINE_SCENES_BUCKET:-eris-offline-scenes}
      # Production posture: dev mode OFF unless explicitly overridden. When OFF,
      # MinIO offline-bucket posture problems fail closed rather than warn.
      OFFLINE_SCENE_DEV_MODE: ${OFFLINE_SCENE_DEV_MODE:-false}
      OFFLINE_SCENE_MAX_RADIUS_M: ${OFFLINE_SCENE_MAX_RADIUS_M:-3000}
      OFFLINE_SCENE_MAX_PACKAGE_MB: ${OFFLINE_SCENE_MAX_PACKAGE_MB:-512}
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_API_BASE: ${VITE_API_BASE}
        # Browser-safe, domain-restricted ArcGIS key — build-time only, never a
        # backend secret. Empty unless set in docker/.env.proxmox.
        VITE_ARCGIS_API_KEY: ${VITE_ARCGIS_API_KEY:-}
    container_name: eris_web
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-0.0.0.0}:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
