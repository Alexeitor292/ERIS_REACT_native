services:
  adminer:
    profiles:
      - devtools

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: eris_backend
    restart: unless-stopped
    env_file:
      - .env.proxmox
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      ENV: ${ENV:-prod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: ${CORS_ORIGINS}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${MARIADB_DATABASE}
      DB_USER: ${MARIADB_USER}
      DB_PASS: ${MARIADB_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_BUCKET: ${MINIO_BUCKET:-eris-uploads}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_OFFLINE_SCENES_BUCKET: ${MINIO_OFFLINE_SCENES_BUCKET:-eris-offline-scenes}
      # Offline-scene policy — MUST match the worker so the API enforces the same
      # AOI/size limits at the generate + download endpoints.
      OFFLINE_SCENE_DEV_MODE: ${OFFLINE_SCENE_DEV_MODE:-false}
      OFFLINE_SCENE_MAX_RADIUS_M: ${OFFLINE_SCENE_MAX_RADIUS_M:-3000}
      OFFLINE_SCENE_MAX_PACKAGE_MB: ${OFFLINE_SCENE_MAX_PACKAGE_MB:-512}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALG: ${JWT_ALG:-HS256}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-120}
    ports:
      - "${API_BIND:-0.0.0.0}:8000:8000"
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_started
      # Block startup until the private offline-scenes bucket is provisioned +
      # posture-verified (fail-closed). Zero manual host-side steps.
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 10

  # One-shot bootstrap: create + verify the PRIVATE, versioned (object-lock)
  # offline-scenes bucket before backend/worker start. Fails closed (nonzero) if
  # the bucket cannot be made private + immutable, blocking the dependents. Does
  # not touch the uploads bucket.
  minio-init:
    image: minio/mc:latest
    container_name: eris_minio_init
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_OFFLINE_SCENES_BUCKET: ${MINIO_OFFLINE_SCENES_BUCKET:-eris-offline-scenes}
    entrypoint: ["/bin/sh", "/scripts/bootstrap-offline-scenes-bucket.sh"]
    volumes:
      - ./scripts:/scripts:ro

  # Automatic offline 3D scene-package generation worker. Separate process so
  # long USGS-3DEP terrain jobs never run in the API request path. Reuses the
  # backend image; claims QUEUED jobs from MariaDB and writes verified packages
  # to the private offline-scenes MinIO bucket.
  offline-scene-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.worker
    container_name: eris_offline_scene_worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker.offline_scene_worker"]
    env_file:
      - .env.proxmox
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      ENV: ${ENV:-prod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${MARIADB_DATABASE}
      DB_USER: ${MARIADB_USER}
      DB_PASS: ${MARIADB_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_BUCKET: ${MINIO_BUCKET:-eris-uploads}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_OFFLINE_SCENES_BUCKET: ${MINIO_OFFLINE_SCENES_BUCKET:-eris-offline-scenes}
      # Production posture: dev mode OFF unless explicitly overridden. When OFF,
      # MinIO offline-bucket posture problems fail closed rather than warn.
      OFFLINE_SCENE_DEV_MODE: ${OFFLINE_SCENE_DEV_MODE:-false}
      OFFLINE_SCENE_MAX_RADIUS_M: ${OFFLINE_SCENE_MAX_RADIUS_M:-3000}
      OFFLINE_SCENE_MAX_PACKAGE_MB: ${OFFLINE_SCENE_MAX_PACKAGE_MB:-512}
      # Road context (worker-only fetch; the mobile app NEVER contacts a road source).
      # none | eris_internal | census_tigerweb (public U.S. Census, credential-free DEV
      # source) | arcgis_feature_service (generic authorized ArcGIS/Enterprise centerlines)
      # | caltrans_crs (OPTIONAL public California highways/freeways, see caltrans vars).
      # See docs/adr-offline-road-context-source.md.
      OFFLINE_SCENE_ROADS_ENABLED: ${OFFLINE_SCENE_ROADS_ENABLED:-true}
      OFFLINE_SCENE_ROAD_SOURCE: ${OFFLINE_SCENE_ROAD_SOURCE:-eris_internal}
      OFFLINE_SCENE_ROAD_SOURCE_URL: ${OFFLINE_SCENE_ROAD_SOURCE_URL:-}
      OFFLINE_SCENE_ROAD_BUFFER_M: ${OFFLINE_SCENE_ROAD_BUFFER_M:-250}
      OFFLINE_SCENE_ROAD_FETCH_TIMEOUT_S: ${OFFLINE_SCENE_ROAD_FETCH_TIMEOUT_S:-30}
      OFFLINE_SCENE_ROAD_CROSS_SECTION_ENABLED: ${OFFLINE_SCENE_ROAD_CROSS_SECTION_ENABLED:-true}
      # Roads required vs optional + explicit (audited) fallback (empty = no fallback).
      OFFLINE_SCENE_ROADS_REQUIRED: ${OFFLINE_SCENE_ROADS_REQUIRED:-false}
      OFFLINE_SCENE_ROAD_FALLBACK_SOURCE: ${OFFLINE_SCENE_ROAD_FALLBACK_SOURCE:-}
      OFFLINE_SCENE_TIGERWEB_BASE_URL: ${OFFLINE_SCENE_TIGERWEB_BASE_URL:-https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/Transportation/MapServer}
      OFFLINE_SCENE_TIGERWEB_LAYERS: ${OFFLINE_SCENE_TIGERWEB_LAYERS:-2,6,8}
      # Caltrans CRS Functional Classification (used only when OFFLINE_SCENE_ROAD_SOURCE=caltrans_crs).
      OFFLINE_SCENE_CALTRANS_ROADS_URL: ${OFFLINE_SCENE_CALTRANS_ROADS_URL:-https://caltrans-gis.dot.ca.gov/arcgis/rest/services/CHhighway/CRS_Functional_Classification/FeatureServer/0}
      OFFLINE_SCENE_CALTRANS_FUNCTIONAL_CLASSES: ${OFFLINE_SCENE_CALTRANS_FUNCTIONAL_CLASSES:-1,2,3}
      OFFLINE_SCENE_CALTRANS_PAGE_SIZE: ${OFFLINE_SCENE_CALTRANS_PAGE_SIZE:-1000}
      OFFLINE_SCENE_CALTRANS_MAX_FEATURES: ${OFFLINE_SCENE_CALTRANS_MAX_FEATURES:-20000}
      OFFLINE_SCENE_CALTRANS_MAX_PAGES: ${OFFLINE_SCENE_CALTRANS_MAX_PAGES:-100}
      OFFLINE_SCENE_CALTRANS_MAX_RESPONSE_MB: ${OFFLINE_SCENE_CALTRANS_MAX_RESPONSE_MB:-32}
      OFFLINE_SCENE_CALTRANS_RETRIES: ${OFFLINE_SCENE_CALTRANS_RETRIES:-2}
      # High-definition TILED aerial imagery (worker-only; OFF by default). Default
      # source is public-domain USGS/USDA NAIP — never a browser ArcGIS key.
      OFFLINE_SCENE_IMAGERY_ENABLED: ${OFFLINE_SCENE_IMAGERY_ENABLED:-false}
      OFFLINE_SCENE_IMAGERY_MODE: ${OFFLINE_SCENE_IMAGERY_MODE:-tiled}
      OFFLINE_SCENE_IMAGERY_TARGET_MPP: ${OFFLINE_SCENE_IMAGERY_TARGET_MPP:-source_native_or_0.6}
      OFFLINE_SCENE_IMAGERY_SOURCE_NATIVE_MPP: ${OFFLINE_SCENE_IMAGERY_SOURCE_NATIVE_MPP:-0.6}
      OFFLINE_SCENE_IMAGERY_TILE_PX: ${OFFLINE_SCENE_IMAGERY_TILE_PX:-1024}
      OFFLINE_SCENE_IMAGERY_TILE_TIMEOUT_S: ${OFFLINE_SCENE_IMAGERY_TILE_TIMEOUT_S:-90}
      OFFLINE_SCENE_IMAGERY_TILE_RETRIES: ${OFFLINE_SCENE_IMAGERY_TILE_RETRIES:-3}
      OFFLINE_SCENE_IMAGERY_OVERALL_DEADLINE_S: ${OFFLINE_SCENE_IMAGERY_OVERALL_DEADLINE_S:-1200}
      OFFLINE_SCENE_IMAGERY_MAX_TILES: ${OFFLINE_SCENE_IMAGERY_MAX_TILES:-64}
      OFFLINE_SCENE_IMAGERY_MAX_MB: ${OFFLINE_SCENE_IMAGERY_MAX_MB:-256}
      OFFLINE_SCENE_IMAGERY_JPEG_QUALITY: ${OFFLINE_SCENE_IMAGERY_JPEG_QUALITY:-85}
      OFFLINE_SCENE_IMAGERY_EXPORT_URL: ${OFFLINE_SCENE_IMAGERY_EXPORT_URL:-https://imagery.nationalmap.gov/arcgis/rest/services/USGSNAIPImagery/ImageServer}
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_API_BASE: ${VITE_API_BASE}
        # Browser-safe, domain-restricted ArcGIS key — build-time only, never a
        # backend secret. Empty unless set in docker/.env.proxmox.
        VITE_ARCGIS_API_KEY: ${VITE_ARCGIS_API_KEY:-}
    container_name: eris_web
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-0.0.0.0}:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
