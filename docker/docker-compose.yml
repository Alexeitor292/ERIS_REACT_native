services:
  mariadb:
    image: mariadb:11
    container_name: eris_mariadb
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    # Localhost only by default: the backend reaches MariaDB over the compose
    # network, so nothing else needs the port. Set MARIADB_BIND to widen it.
    ports:
      - "${MARIADB_BIND:-127.0.0.1}:3306:3306"
    volumes:
      - eris_mariadb_data:/var/lib/mysql
      - ../database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 15

  adminer:
    image: adminer:latest
    container_name: eris_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_BIND:-127.0.0.1}:8081:8080"
    depends_on:
      mariadb:
        condition: service_healthy

  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    container_name: eris_seaweedfs
    restart: unless-stopped
    command: mini -dir=/data
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-eris-uploads}
    ports:
      # Presigned file URLs point directly to the S3 gateway.
      - "9800:8333"
    volumes:
      - eris_seaweedfs_data:/data

volumes:
  eris_mariadb_data:
  eris_seaweedfs_data:
    name: eris_seaweedfs_data
