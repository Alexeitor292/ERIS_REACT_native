# XcodeGen definition of the ERIS iOS app. CI generates ios/ERIS.xcodeproj from
# this file and commits it, so the Mac needs only Xcode: open ERIS.xcodeproj.
# Change targets, settings or packages here, never in the .xcodeproj.
name: ERIS
options:
  bundleIdPrefix: gov.ca.dot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
# One build per deployment. Debug and Staging talk to the staging ERIS and run
# the maps under ArcGIS developer licensing; Release is the Caltrans production
# build, licensed with the ArcGIS Maps SDK 200.x license the production ERIS
# serves (ARCGIS_LICENSE_KEY). Archive the "ERIS Staging" scheme for testers and
# the "ERIS" scheme for production.
configs:
  Debug: debug
  Staging: release
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ERISKit:
    path: ERISKit
  MSAL:
    url: https://github.com/AzureAD/microsoft-authentication-library-for-objc
    exactVersion: "1.9.0"
  # Maps: the site-area editor, the photo map and offline basemaps. The API key
  # and license come from ERIS at run time (/arcgis/runtime-config).
  ArcGIS:
    url: https://github.com/Esri/arcgis-maps-sdk-swift
    exactVersion: "200.8.3"
targets:
  ERIS:
    type: application
    platform: iOS
    sources:
      - path: ERIS
        excludes:
          - "*.entitlements"
          - "Info.plist"
    dependencies:
      - package: ERISKit
      - package: MSAL
      - package: ArcGIS
        product: ArcGIS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gov.ca.dot.eris
        INFOPLIST_FILE: ERIS/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ERIS_DISPLAY_NAME: ERIS
      # ERIS_API_BASE_URL: the ERIS API each build talks to (set the real hosts).
      # ERIS_DEPLOYMENT: staging or production, which decides the maps' licensing.
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: ERIS/ERIS-Debug.entitlements
          ERIS_API_BASE_URL: https://eris-stage.example.gov/api
          ERIS_DEPLOYMENT: staging
        Staging:
          CODE_SIGN_ENTITLEMENTS: ERIS/ERIS-Release.entitlements
          ERIS_API_BASE_URL: https://eris-stage.example.gov/api
          ERIS_DEPLOYMENT: staging
          ERIS_DISPLAY_NAME: ERIS Staging
        Release:
          CODE_SIGN_ENTITLEMENTS: ERIS/ERIS-Release.entitlements
          ERIS_API_BASE_URL: https://eris.example.gov/api
          ERIS_DEPLOYMENT: production
  # Drives Debug builds in demo mode (sample data, no sign-in) and saves
  # screenshots; see ERISUITests/ScreenTour.swift.
  ERISUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ERISUITests
    dependencies:
      - target: ERIS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: gov.ca.dot.eris.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
schemes:
  ERIS:
    build:
      targets:
        ERIS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ERISUITests
    archive:
      config: Release
  ERIS Staging:
    build:
      targets:
        ERIS: all
    run:
      config: Staging
    profile:
      config: Staging
    analyze:
      config: Staging
    archive:
      config: Staging
