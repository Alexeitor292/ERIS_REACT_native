server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Browser hardening. HSTS belongs on the TLS gateway, which owns HTTPS.
  #
  # The enforced Content-Security-Policy limits framing only. The full policy
  # below is REPORT-ONLY: browsers log what it would block (DevTools console)
  # without blocking it. Exercise every screen on staging (maps, 3D terrain,
  # drone surveys, Street View, PDF preview), add any source the console
  # reports, then rename the header to Content-Security-Policy to enforce it
  # (docs/security/README.md, open items). script-src 'self' is the part that
  # matters: an injected <script> or inline handler would not run.
  set $eris_csp_report_only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-src 'self' https:; media-src 'self' blob: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
  set $eris_permissions "camera=(), microphone=(), payment=(), usb=(), serial=(), bluetooth=(), geolocation=(self), fullscreen=(self)";

  # nginx drops these in any location with its own add_header: repeat them there.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Content-Security-Policy "frame-ancestors 'self'" always;
  add_header Content-Security-Policy-Report-Only $eris_csp_report_only always;
  add_header Permissions-Policy $eris_permissions always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # All browser API calls (including Entra callback) share this origin.
  location /api/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
    client_max_body_size 100m;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # The start page names this release's files. Browsers must check it on every
  # visit (a cheap 304 when nothing changed), or after an update they keep
  # running a release whose files the server no longer has.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Content-Security-Policy-Report-Only $eris_csp_report_only always;
    add_header Permissions-Policy $eris_permissions always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
  }

  # Built files and map assets: a missing one is a 404, not the start page,
  # which the browser would try and fail to run as a script.
  location /assets/ {
    try_files $uri =404;
  }

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}
