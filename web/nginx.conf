server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Baseline browser hardening that cannot break the app. HSTS belongs on the
  # TLS gateway, which owns HTTPS. A full script/style Content-Security-Policy
  # needs the ArcGIS and map sources agreed first, so only framing is limited.
  # nginx drops these in any location with its own add_header: repeat them there.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Content-Security-Policy "frame-ancestors 'self'" always;

  # All browser API calls (including Entra callback) share this origin.
  location /api/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
    client_max_body_size 100m;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # The start page names this release's files. Browsers must check it on every
  # visit (a cheap 304 when nothing changed), or after an update they keep
  # running a release whose files the server no longer has.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
  }

  # Built files and map assets: a missing one is a 404, not the start page,
  # which the browser would try and fail to run as a script.
  location /assets/ {
    try_files $uri =404;
  }

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}
