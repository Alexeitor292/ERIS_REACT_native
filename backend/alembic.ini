# Alembic configuration for ERIS.
#
# Run all alembic commands from the backend/ directory:
#   cd backend
#   alembic current
#   alembic history
#   alembic upgrade head
#
# Or use the helper scripts:
#   .\migrate.ps1 current       (Windows)
#   ./migrate.sh current        (Linux / Proxmox)
#
# IMPORTANT: Do not put real database credentials in this file.
# The database URL is injected at runtime by migrations/env.py,
# which reads from backend/.env (or environment variables) via app settings.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Placeholder — overridden by migrations/env.py. Never put real creds here.
sqlalchemy.url = override_in_env_py

[post_write_hooks]
# Optionally run black or ruff on generated migration files.
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
